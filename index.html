<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TO-DO list</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  
  <body>
    <div class="container">
      <header>
        <h1>My Tasks</h1>
        <p>Stay organised,one task at a time.</p>
      </header>
      <main>
        <form id="task-form"> 
          <input 
            type="text"
            id="task-input"
            placeholder="Enetr your task...."
            autocomplete="off" > 
          <button type="sumbit">
            + ADD TASK 
          </button>
        </form>
        <section class="task-section">
          <h2>Today's Tasks</h2>
          <ul id="task-list">
          </ul>
          <p id="emoty-message">
            No task yet. Add your first task!
          </p> 
        </section>   
      </main>
    </div>
  </body>
</html>
